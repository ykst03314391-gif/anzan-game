<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="算数ゲーム">
  <title>算数暗算ゲーム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="screen-top">
  <div class="top-header">
    <h1>⭐ 算数暗算ゲーム</h1>
    <p>あんざんをれんしゅうしよう！</p>
    <div id="top-user-badge" class="hidden"></div>
  </div>

  <div class="top-nav">
    <button id="btn-go-ranking"    class="btn btn-ghost">🏆 ランキング</button>
    <button id="btn-go-mission"    class="btn btn-ghost">📅 ミッション</button>
    <button id="btn-go-collection" class="btn btn-ghost">🖼 コレクション</button>
    <button id="btn-go-settings"   class="btn btn-ghost">⚙ 設定</button>
  </div>

  <div class="scroll-container">

    <div class="card">
      <h2>① 計算をえらぼう</h2>

      <div class="calc-tabs">
        <button class="calc-tab active" data-group="add">たし算</button>
        <button class="calc-tab"        data-group="sub">ひき算</button>
        <button class="calc-tab"        data-group="mul">かけ算</button>
        <button class="calc-tab"        data-group="div">わり算</button>
        <button class="calc-tab"        data-group="rand">ランダム</button>
      </div>

      <div id="calc-group-add" class="calc-group calc-btn-grid">
        <button class="calc-btn" data-calc-id="add_1_1">1＋1</button>
        <button class="calc-btn" data-calc-id="add_2_1">2＋1</button>
        <button class="calc-btn" data-calc-id="add_2_2">2＋2</button>
        <button class="calc-btn" data-calc-id="add_3_1">3＋1</button>
        <button class="calc-btn" data-calc-id="add_3_2">3＋2</button>
        <button class="calc-btn" data-calc-id="add_3_3">3＋3</button>
        <button class="calc-btn" data-calc-id="add_4_1">4＋1</button>
        <button class="calc-btn" data-calc-id="add_4_2">4＋2</button>
        <button class="calc-btn" data-calc-id="add_4_3">4＋3</button>
        <button class="calc-btn" data-calc-id="add_4_4">4＋4</button>
      </div>

      <div id="calc-group-sub" class="calc-group calc-btn-grid hidden">
        <button class="calc-btn" data-calc-id="sub_1_1">1－1</button>
        <button class="calc-btn" data-calc-id="sub_2_1">2－1</button>
        <button class="calc-btn" data-calc-id="sub_2_2">2－2</button>
        <button class="calc-btn" data-calc-id="sub_3_1">3－1</button>
        <button class="calc-btn" data-calc-id="sub_3_2">3－2</button>
        <button class="calc-btn" data-calc-id="sub_3_3">3－3</button>
        <button class="calc-btn" data-calc-id="sub_4_1">4－1</button>
        <button class="calc-btn" data-calc-id="sub_4_2">4－2</button>
        <button class="calc-btn" data-calc-id="sub_4_3">4－3</button>
        <button class="calc-btn" data-calc-id="sub_4_4">4－4</button>
      </div>

      <div id="calc-group-mul" class="calc-group calc-btn-grid hidden">
        <button class="calc-btn" data-calc-id="mul_kuku">九九</button>
        <button class="calc-btn" data-calc-id="mul_2_1">2×1</button>
        <button class="calc-btn" data-calc-id="mul_2_2">2×2</button>
        <button class="calc-btn" data-calc-id="mul_3_1">3×1</button>
        <button class="calc-btn" data-calc-id="mul_3_2">3×2</button>
      </div>

      <div id="calc-group-div" class="calc-group calc-btn-grid hidden">
        <button class="calc-btn" data-calc-id="div_1_1_no">1÷1<br><small>あまりなし</small></button>
        <button class="calc-btn" data-calc-id="div_1_1_r" >1÷1<br><small>あまりあり</small></button>
        <button class="calc-btn" data-calc-id="div_2_1_no">2÷1<br><small>あまりなし</small></button>
        <button class="calc-btn" data-calc-id="div_2_1_r" >2÷1<br><small>あまりあり</small></button>
        <button class="calc-btn" data-calc-id="div_3_1_no">3÷1<br><small>あまりなし</small></button>
        <button class="calc-btn" data-calc-id="div_3_1_r" >3÷1<br><small>あまりあり</small></button>
      </div>

      <div id="calc-group-rand" class="calc-group calc-btn-grid hidden">
        <button class="calc-btn" data-calc-id="rand_1">ランダム<br><small>1桁</small></button>
        <button class="calc-btn" data-calc-id="rand_2">ランダム<br><small>2桁</small></button>
        <button class="calc-btn" data-calc-id="rand_3">ランダム<br><small>3桁</small></button>
      </div>
    </div>

    <div class="card">
      <h2>② モードをえらぼう</h2>
      <div class="btn-row">
        <button class="mode-btn" data-mode="count">📝 もんだいすう</button>
        <button class="mode-btn" data-mode="time">⏱ せいげん時間</button>
      </div>

      <div id="count-options" class="hidden" style="margin-top:12px;">
        <div class="btn-row">
          <button class="count-btn" data-value="10">10もん</button>
          <button class="count-btn" data-value="20">20もん</button>
          <button class="count-btn" data-value="30">30もん</button>
        </div>
      </div>

      <div id="time-options" class="hidden" style="margin-top:12px;">
        <div class="btn-row">
          <button class="time-btn" data-value="1">1ふん</button>
          <button class="time-btn" data-value="3">3ふん</button>
          <button class="time-btn" data-value="5">5ふん</button>
        </div>
      </div>
    </div>

    <button id="btn-start" class="btn btn-primary" disabled>スタート！</button>
  </div>
</div>

<script src="js/rewards.js"></script>
<script src="js/settings.js"></script>
<script src="js/ranking.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/page-main.js"></script>

</body>
</html>
